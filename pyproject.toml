[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentops"
version = "2.0.0"
description = "AgentOps Intelligence - AI agent monitoring, evaluation and analytics"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["agentops*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]