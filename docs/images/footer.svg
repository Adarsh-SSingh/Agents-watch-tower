<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="110" viewBox="0 0 1200 110" role="img" aria-label="Thanks for visiting">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#060b18"/><stop offset="1" stop-color="#0a2a33"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e3a5f" stroke-opacity="0.35"/></pattern>
  </defs>
  <rect width="1200" height="110" fill="url(#bg)"/><rect width="1200" height="110" fill="url(#grid)"/>
  <!-- heartbeat-style trace line -->
  <path d="M0 55 H100 l12 0 l10 -30 l14 60 l10 -30 H1200" fill="none" stroke="#22d3ee" stroke-width="2" stroke-opacity="0.35"/>
  <path d="M0 55 H100 l12 0 l10 -30 l14 60 l10 -30 H1200" fill="none" stroke="#22d3ee" stroke-width="3" stroke-dasharray="120 1200" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" values="120;-1300" dur="4s" repeatCount="indefinite"/>
  </path>
  <text x="600" y="38" text-anchor="middle" fill="#e6f1ff" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600">Every run traced. Every wrong answer caught.</text>
  <text x="600" y="96" text-anchor="middle" fill="#7dd3fc" font-family="Consolas, 'Courier New', monospace" font-size="14">thanks for visiting <tspan fill="#22c55e">&#9679;</tspan> status: in progress</text>
</svg>
