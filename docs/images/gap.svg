<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="360" viewBox="0 0 1220 360" role="img" aria-label="Run status versus answer correctness">
<rect width="1220" height="360" rx="16" fill="#0b1220"/>
<text x="40" y="44" fill="#ffffff" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700">A "success" status is not a correct answer</text>
<text x="40" y="68" fill="#7dd3fc" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">Document Agent, same agent and same run status in every row</text>
<text x="40" y="110" fill="#cbd5e1" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16">Document runs that finished as "success"</text>
<rect x="560" y="88" width="620" height="30" rx="8" fill="#16243b"/>
<rect x="560" y="88" width="0" height="30" rx="8" fill="#22d3ee"><animate attributeName="width" from="0" to="616.9" dur="1.2s" begin="0.0s" fill="freeze"/></rect>
<text x="1166.9" y="109" text-anchor="end" fill="#ffffff" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" opacity="0">99.5%<animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.0s" fill="freeze"/></text>
<text x="40" y="162" fill="#cbd5e1" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16">Answers correct on generated documents</text>
<rect x="560" y="140" width="620" height="30" rx="8" fill="#16243b"/>
<rect x="560" y="140" width="0" height="30" rx="8" fill="#22c55e"><animate attributeName="width" from="0" to="594.0" dur="1.2s" begin="0.15s" fill="freeze"/></rect>
<text x="1144.0" y="161" text-anchor="end" fill="#ffffff" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" opacity="0">95.8%<animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.15s" fill="freeze"/></text>
<text x="40" y="214" fill="#cbd5e1" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16">Answers correct on real documents, new questions, fixes ON</text>
<rect x="560" y="192" width="620" height="30" rx="8" fill="#16243b"/>
<rect x="560" y="192" width="0" height="30" rx="8" fill="#a78bfa"><animate attributeName="width" from="0" to="458.2" dur="1.2s" begin="0.3s" fill="freeze"/></rect>
<text x="1008.2" y="213" text-anchor="end" fill="#ffffff" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" opacity="0">73.9%<animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.3s" fill="freeze"/></text>
<text x="40" y="266" fill="#cbd5e1" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16">Same questions, fixes OFF</text>
<rect x="560" y="244" width="620" height="30" rx="8" fill="#16243b"/>
<rect x="560" y="244" width="0" height="30" rx="8" fill="#7c6bd6"><animate attributeName="width" from="0" to="429.0" dur="1.2s" begin="0.44999999999999996s" fill="freeze"/></rect>
<text x="979.0" y="265" text-anchor="end" fill="#ffffff" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" opacity="0">69.2%<animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.45s" fill="freeze"/></text>
<text x="40" y="318" fill="#cbd5e1" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16">Answers correct on real documents, first test</text>
<rect x="560" y="296" width="620" height="30" rx="8" fill="#16243b"/>
<rect x="560" y="296" width="0" height="30" rx="8" fill="#ef4444"><animate attributeName="width" from="0" to="368.9" dur="1.2s" begin="0.6s" fill="freeze"/></rect>
<text x="918.9" y="317" text-anchor="end" fill="#ffffff" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" opacity="0">59.5%<animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.6s" fill="freeze"/></text>
</svg>