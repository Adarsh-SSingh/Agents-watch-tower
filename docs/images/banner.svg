<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="AI Agent Watch Tower">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060b18"/><stop offset="0.6" stop-color="#0b1730"/><stop offset="1" stop-color="#0a2a33"/>
    </linearGradient>
    <radialGradient id="sweep" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.55"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e3a5f" stroke-opacity="0.35" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#grid)"/>

  <!-- radar -->
  <g transform="translate(190 140)">
    <circle r="112" fill="#071426" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="1.5"/>
    <circle r="84" fill="none" stroke="#22d3ee" stroke-opacity="0.35"/>
    <circle r="56" fill="none" stroke="#22d3ee" stroke-opacity="0.35"/>
    <circle r="28" fill="none" stroke="#22d3ee" stroke-opacity="0.35"/>
    <line x1="-112" y1="0" x2="112" y2="0" stroke="#22d3ee" stroke-opacity="0.3"/>
    <line x1="0" y1="-112" x2="0" y2="112" stroke="#22d3ee" stroke-opacity="0.3"/>
    <g>
      <path d="M0 0 L112 0 A112 112 0 0 0 79 -79 Z" fill="url(#sweep)"/>
      <line x1="0" y1="0" x2="112" y2="0" stroke="#22d3ee" stroke-width="2"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite"/>
    </g>
    <circle cx="-50" cy="-38" r="5" fill="#22c55e"><animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="38" cy="-62" r="5" fill="#22c55e"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="-20" cy="52" r="5" fill="#22c55e"><animate attributeName="opacity" values="1;0.3;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="62" cy="34" r="6" fill="#f59e0b">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="62" cy="34" r="6" fill="none" stroke="#f59e0b" stroke-width="2">
      <animate attributeName="r" values="6;22" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- title -->
  <text x="360" y="118" fill="#e6f1ff" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="1">AI Agent Watch Tower</text>
  <text x="362" y="158" fill="#7dd3fc" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="23">Every run traced. Every wrong answer caught.</text>

  <!-- agent status chips -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#cbd5e1">
    <g transform="translate(362 196)">
      <rect width="150" height="38" rx="19" fill="#0f2238" stroke="#22c55e" stroke-opacity="0.6"/>
      <circle cx="22" cy="19" r="6" fill="#22c55e"><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></circle>
      <text x="40" y="25">Tool Agent</text>
    </g>
    <g transform="translate(530 196)">
      <rect width="176" height="38" rx="19" fill="#0f2238" stroke="#22c55e" stroke-opacity="0.6"/>
      <circle cx="22" cy="19" r="6" fill="#22c55e"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.3s" repeatCount="indefinite"/></circle>
      <text x="40" y="25">Research Agent</text>
    </g>
    <g transform="translate(724 196)">
      <rect width="194" height="38" rx="19" fill="#0f2238" stroke="#f59e0b" stroke-opacity="0.8"/>
      <circle cx="22" cy="19" r="6" fill="#f59e0b"><animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/></circle>
      <text x="40" y="25">Document Agent</text>
    </g>
  </g>
  <text x="936" y="221" fill="#f59e0b" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15">silent failures found</text>
</svg>
